services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://car:56837425@vdd-car-vydzch:5432/car
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - car-rental-network
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: 53837425
      POSTGRES_DB: car
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - car-rental-network

networks:
  car-rental-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
